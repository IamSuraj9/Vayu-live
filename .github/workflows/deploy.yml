name: Deploy site

# Builds the app with fresh wind data and publishes it to Cloudflare Pages.
# Runs after every storm refresh, on pushes to main, and on demand.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages, Edit) and CLOUDFLARE_ACCOUNT_ID.
# Until they are set, the site is built and checked but not published.

on:
  workflow_run:
    workflows: ["Refresh storm data"]
    types: [completed]
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true # only the newest build matters

env:
  PROJECT: ${{ vars.CF_PAGES_PROJECT || 'vayu-live' }}
  # The first address testers were given. After the move it only redirects to the new one.
  LEGACY_PROJECT: storm-globe

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # After a refresh, build the newest main (the refresh commits new storm data after its trigger commit).
          # Otherwise build the commit that started the run: main on a push, or the branch picked in "Run workflow".
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wind field from the newest GFS run
        run: |
          pip install --quiet eccodes numpy
          if ! python -m pipeline.wind --out app/public/data/wind.json --coarse-out app/public/data/wind-1.json; then
            echo "::warning::GFS download failed; reusing the wind fields from the live site"
            for f in wind.json wind-1.json; do
              curl -fsS "${{ vars.SITE_URL || format('https://{0}.pages.dev', env.PROJECT) }}/data/$f" \
                -o "app/public/data/$f" || echo "::warning::No $f; the app falls back to its built-in wind"
            done
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npm run build
          ls -la dist dist/data

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet, so the build was not published"
            exit 0
          fi
          # Creates the project the first time; afterwards this fails harmlessly because it exists
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main 2>/dev/null || true
          # main publishes the live site; any other branch publishes a preview copy at
          # https://<branch-name>.<project>.pages.dev and leaves the live site alone
          npx --yes wrangler@4 pages deploy app/dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true

      # Testers have links to the old address. Publish a redirect there, from the same build step as the real site:
      # main redirects to the new live address, and a branch preview redirects to the same branch preview of the new
      # project. It runs on pushes and manual runs, not after every storm refresh, so the old project is touched rarely.
      # A failure here never fails the deploy of the real site.
      - name: Keep the old address working
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ "$PROJECT" = "$LEGACY_PROJECT" ]; then
            echo "::notice::Nothing to redirect"
            exit 0
          fi
          if [ "$BRANCH" = main ]; then
            target="https://$PROJECT.pages.dev"
          else
            slug=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g')
            target="https://$slug.$PROJECT.pages.dev"
          fi
          mkdir -p moved
          printf '/* %s/:splat 301\n' "$target" > moved/_redirects
          cat moved/_redirects
          npx --yes wrangler@4 pages deploy moved --project-name="$LEGACY_PROJECT" --branch="$BRANCH" --commit-dirty=true \
            || echo "::warning::Could not publish the redirect on the old address"
