name: Refresh storm data

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, at 17 minutes past to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-storms
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the pipeline
        run: python -m unittest discover -s pipeline/tests -t .
      - name: Fetch NHC, GDACS and NOAA tcvitals
        run: python -m pipeline.storms --out app/public/data/storms.json
      - name: Commit the new data
        run: |
          if git diff --quiet -- app/public/data/storms.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data/storms.json
          git commit -m "data: refresh storms $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
